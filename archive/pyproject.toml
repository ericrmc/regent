[project]
name = "regent"
version = "0.1.0"
description = "A harness that stands in for a human product owner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "rich>=13.9",
]

[project.scripts]
regent = "regent.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Two infinite loops were found by tests during the build. A timeout turns a
# hang into a failure with a traceback instead of a run that never ends.
timeout = 120
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
